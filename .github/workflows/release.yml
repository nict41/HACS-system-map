name: Release

# HACS installs a plugin from a GitHub *release*, not from a bare tag, so
# pushing a tag has to create one. Tag and publish in one step:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release whose tag disagrees with the VERSION the card reports would
      # make every future "what version are you running" answer a lie, so
      # this fails the release rather than publishing the mismatch.
      - name: Check the tag matches VERSION in the card
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' system-map-card.js)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION \"${version}\" in system-map-card.js"
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME} (VERSION ${version})"

      - name: Run the tests
        run: node test/system-map-card.test.mjs

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            system-map-card.js
