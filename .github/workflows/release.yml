name: Release

# HACS installs a plugin from a GitHub *release*, not from a bare tag, and it
# is the release that makes an update appear in HACS at all. So a release is
# cut automatically whenever VERSION changes on main - bump VERSION in the
# commit and the release follows, with no second step to forget.
#
# Three routes, all of which end up here and all of which are safe to repeat:
#   - Push to main with a new VERSION -> tag and release created here.
#   - Publish from the website (Releases -> Draft a new release -> create the
#     tag on publish) -> the card is attached to the release you made.
#   - git tag v1.2.3 && git push origin v1.2.3 -> same, from a terminal.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and tag
        id: v
        run: |
          version="$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' system-map-card.js)"
          if [ -z "$version" ]; then
            echo "::error::could not read VERSION from system-map-card.js"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            # A release whose tag disagrees with the version the card reports
            # would make every future "what are you running" answer a lie.
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::tag ${tag} does not match VERSION \"${version}\" in system-map-card.js"
              exit 1
            fi
          else
            tag="v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version $version, tag $tag"

      # "Already released" has to mean *published*. A failed create can leave
      # a draft behind - a 504 from the create call did exactly that once,
      # and a draft has no tag, 404s from /releases/tags/, and is invisible to
      # HACS. Treating that as released is how an update silently never
      # arrives, so a draft is published rather than skipped over.
      - name: Skip if this version is already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          case "$state" in
            false)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "$TAG is already published."
              ;;
            true)
              echo "::warning::$TAG exists only as a draft - publishing it."
              gh release edit "$TAG" --draft=false --tag "$TAG" --target "${GITHUB_SHA}"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # A release is only ever cut from code that passes, whichever route
      # triggered it.
      - name: Run the tests
        if: steps.check.outputs.exists == 'false' || github.ref_type == 'tag'
        run: node test/system-map-card.test.mjs

      # Retried because the GitHub API does occasionally 504 on this call, and
      # losing a release to a transient timeout means the update silently
      # never reaches HACS. Each attempt re-checks for an existing release, so
      # a create that actually succeeded before timing out is not duplicated.
      - name: Create the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          for attempt in 1 2 3; do
            # A previous attempt may have created it (published or draft)
            # before the response timed out.
            state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
            if [ "$state" != "missing" ]; then
              echo "$TAG exists now; publishing it if needed and attaching the card."
              [ "$state" = "true" ] && gh release edit "$TAG" --draft=false --tag "$TAG" --target "${GITHUB_SHA}"
              gh release upload "$TAG" system-map-card.js --clobber && exit 0
            fi
            # --target pins the tag to this commit, so pushing to main creates
            # the tag as well as the release.
            if gh release create "$TAG" \
                 --target "${GITHUB_SHA}" \
                 --title "$TAG" \
                 --generate-notes \
                 system-map-card.js; then
              exit 0
            fi
            echo "::warning::attempt ${attempt} to create $TAG failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not create release $TAG after 3 attempts"
          exit 1

      - name: Attach the card to a release published from the website
        if: steps.check.outputs.exists == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.v.outputs.tag }}" system-map-card.js --clobber
