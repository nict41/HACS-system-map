name: Release

# HACS installs a plugin from a GitHub *release*, not from a bare tag.
#
# Either route works and both end up here:
#   - From the website: Releases -> "Draft a new release" -> type the tag in
#     "Choose a tag" -> "Create new tag on publish" -> Publish. Publishing
#     creates the tag, which fires this workflow.
#   - From a terminal: git tag v1.2.3 && git push origin v1.2.3
#
# So this workflow must cope with the release already existing by the time it
# runs. It attaches the card to whichever release is there rather than
# failing, and still checks the tag against VERSION either way.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release whose tag disagrees with the VERSION the card reports would
      # make every future "what version are you running" answer a lie, so
      # this fails the release rather than publishing the mismatch.
      - name: Check the tag matches VERSION in the card
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' system-map-card.js)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION \"${version}\" in system-map-card.js"
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME} (VERSION ${version})"

      - name: Run the tests
        run: node test/system-map-card.test.mjs

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists (published from the website); attaching the card to it."
            gh release upload "${GITHUB_REF_NAME}" system-map-card.js --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              system-map-card.js
          fi
