name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # HACS's own rules change over time, so re-validate weekly rather than
    # only when something in this repo moves.
    - cron: "0 6 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check system-map-card.js
      - name: Tests
        run: node test/system-map-card.test.mjs

  hacs:
    runs-on: ubuntu-latest
    # Advisory, not blocking. These checks are the entry requirements for the
    # HACS *default store*; none of them affect installing this repo as a
    # custom repository, which is how it's used today. Its findings still show
    # in the log. Outstanding at the time of writing: the repository needs at
    # least one GitHub topic (Settings -> About -> Topics). Once that's set,
    # delete this line and let the check gate the build properly.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
